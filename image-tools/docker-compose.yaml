name: image-tools

services:
  caddy:
    build: ./caddy
    container_name: caddy-upload
    user: "1000:1000"
    cap_add:
      - NET_ADMIN
    ports:
      - "80:80"
      - "8080:8080"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./config/caddy/conf:/etc/caddy
      - ../:/srv
    restart: unless-stopped

  sub-store:
    image: xream/sub-store:http-meta
    container_name: sub-store
    environment:
      - SUB_STORE_FRONTEND_BACKEND_PATH=/2cXaAxRGfddmGz2yx1wA
      - SUB_STORE_BACKEND_API_PORT=3002
      - SUB_STORE_BACKEND_MERGE=true
      - SUB_STORE_CORS_ALLOWED_ORIGINS=*
    ports:
      - "3002:3002"
    volumes:
      - ./data/sub-store/:/opt/app/data
    restart: unless-stopped

  openlist:
    image: ghcr.io/openlistteam/openlist-git:latest-aio
    container_name: openlist
    user: "1000:1000"
    volumes:
      - "./data/openlist:/opt/openlist/data"
    ports:
      - "5244:5244"
    environment:
      - UMASK=022
      - TZ=Asia/Shanghai
      - OPENLIST_ADMIN_PASSWORD=admin
    restart: unless-stopped

  cli-proxy-api:
    image: eceasy/cli-proxy-api:latest
    container_name: cli-proxy-api
    restart: unless-stopped
    ports:
      - "8317:8317"
    volumes:
      - cpa-data:/app/data
      - ./config/cli-proxy-api/config.yaml:/CLIProxyAPI/config.yaml

  cpa-manager-plus:
    image: seakee/cpa-manager-plus:latest
    container_name: cpa-manager-plus
    restart: unless-stopped
    ports:
      - "18317:18317"
    volumes:
      - cpa-manager-plus-data:/data

  postgres:
    image: postgres:18-alpine
    container_name: postgres-mg
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=hindsight
    volumes:
      - ./data/postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d hindsight"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

volumes:
  cpa-data:
  cpa-manager-plus-data:
