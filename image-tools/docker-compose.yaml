name: image-tools

services:
  caddy:
    build: ./caddy
    container_name: caddy-upload
    user: "1000:1000"
    cap_add:
      - NET_ADMIN
    ports:
      - "80:80"
      - "8080:8080"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./config/caddy/conf:/etc/caddy
      - ../:/srv
    restart: unless-stopped

  sub-store:
    image: xream/sub-store:http-meta
    container_name: sub-store
    environment:
      - SUB_STORE_FRONTEND_BACKEND_PATH=/2cXaAxRGfddmGz2yx1wA
      - SUB_STORE_BACKEND_API_PORT=3002
      - SUB_STORE_BACKEND_MERGE=true
    ports:
      - "3002:3002"
    volumes:
      - ./data/sub-store/:/opt/app/data
    restart: unless-stopped

  openlist:
    image: ghcr.io/openlistteam/openlist-git:latest-aio
    container_name: openlist
    user: "1000:1000"
    volumes:
      - "./data/openlist:/opt/openlist/data"
    ports:
      - "5244:5244"
    environment:
      - UMASK=022
      - TZ=Asia/Shanghai
      - OPENLIST_ADMIN_PASSWORD=admin
    restart: unless-stopped

  gpt-load:
    image: ghcr.io/tbphp/gpt-load:latest
    container_name: gpt-load
    restart: always
    user: "1000:1000"
    volumes:
      - ./data/gpt-load:/app/data
    env_file:
      - ./config/gpt-load/.env
    ports:
      - "3001:3001"
    healthcheck:
      test: wget -q --spider -T 10 -O /dev/null http://localhost:${PORT:-3001}/health
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  postgres:
    image: postgres:18-alpine
    container_name: postgres-mg
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=hindsight
    volumes:
      - ./data/postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d hindsight"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
